<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout/layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>User View</title>
    <style>
        .user-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 16px;
            text-align: center;
            border-radius: 15px;
        }

        .user-table thead {
            background-color: #0092ff;
            color: #ffffff;
        }

        .user-table th, .user-table td {
            padding: 12px 20px;
            border: 1px solid #ddd;
        }
    </style>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
<!-- aside (사용 버전) -->
<th:block layout:fragment="aside">
    <!--<aside> 태그는 *꼭* 남겨두시고 안에서 작업하시면 됩니다 // 절대 지우시면 안돼요-->
    <aside>
        <h1><a th:href="@{/admin/chartView}">통계조회</a></h1><br>
        <h1><a th:href="@{/admin/classView}">강의검토</a></h1><br>
        <h1><a th:href="@{/admin/userView}">사용자 목록</a></h1><br>
    </aside>
</th:block>

<!-- content -->
<div layout:fragment="content" style="min-height: 1000px" >
    <h1>사용자 목록</h1><Br>
    <table border="1" class="user-table">
        <thead>
        <tr>
            <th>이름</th>
            <th>사용자아이디</th>
            <th>전화번호</th>
            <th>이메일</th>
            <th>생년월일</th>
            <th>성별</th>
            <th>계정 생성일시</th>
            <th>계정 상태</th>
            <th>계정 삭제</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${user}">
            <td th:text="${user.name}"></td>
            <td th:text="${user.userId}"></td>
            <td th:text="${user.phoneNumber}"></td>
            <td th:text="${user.email}"></td>
            <td th:text="${user.birth}"></td>
            <td th:text="${user.gender}"></td>
            <td th:text="${user.createdAt}"></td>
            <td>
                <select class="status-select" th:data-user-id="${user.userId}" onchange="updateUserStatus(this)">
                    <option value="Y" th:selected="${user.role eq 'ROLE_USER'}">활성화</option>
                    <option value="N" th:selected="${user.role eq 'ROLE_PICLE'}">비활성화</option>
                </select>
            </td>
            <td>
                <i class="fas fa-times delete-icon" onclick="deleteUser(this)" th:data-user-id="${user.userId}"></i>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>

<!--이거밖에서 스크립트 작성하면 안돌아갑니다...-->
<div layout:fragment="scripts">
    <script>
        function updateUserStatus(selectElement) {
            let userId = selectElement.getAttribute("data-user-id");
            let newStatus = selectElement.value;

            axios.post('/admin-api/updateUserStatus', {
                userId: userId,
                role: newStatus === "Y" ? "ROLE_USER" : "ROLE_PICLE"
            })
                .then(response => {
                    if (response.data.success) {
                        alert("사용자 상태가 변경되었습니다!");
                    } else {
                        alert("변경에 실패했습니다. 다시 시도해주세요.");
                        location.reload();
                    }
                })
                .catch(error => {
                    console.error("에러 발생:", error);
                    alert("서버 오류가 발생했습니다.");
                });
        }

        function deleteUser(iconElement) {
            let userId = iconElement.getAttribute("data-user-id");

            if (!confirm("정말로 이 사용자를 삭제하시겠습니까?")) {
                return;
            }

            axios.delete(`/admin-api/deleteUser/${userId}`)
                .then(response => {
                    if (response.data.success) {
                        alert("사용자가 삭제되었습니다!");
                        location.reload(); // 페이지 새로고침
                    } else {
                        alert("삭제에 실패했습니다. 다시 시도해주세요.");
                    }
                })
                .catch(error => {
                    console.error("에러 발생:", error);
                    alert("서버 오류가 발생했습니다.");
                });
        }
    </script>
</div>
</html>
