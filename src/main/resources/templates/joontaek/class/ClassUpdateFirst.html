<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout/layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>강의 검토</title>
    <link rel="stylesheet" href="/css/joontaek/makeClassFirst.css">
</head>
<body>
<th:block layout:fragment="aside"></th:block>

<div layout:fragment="content" class="content-container">
    <div class="form-container">
        <h2>강의 검토</h2>

        <form action="/view/classUpdate/updateThumbnail" method="post" enctype="multipart/form-data">

            <input type="hidden" name="classId" th:value="${classInfo.classId}">
            <input type="hidden" name="classPermit" th:value="${classInfo.classPermit}">


            <div class="input-group">
                <label for="classTitle">강의 제목</label>
                <input type="text" id="classTitle" name="classTitle" th:value="${classInfo.classTitle}">
            </div>

            <div class="input-group">
                <label for="description">강의 설명</label>
                <textarea id="description" name="description" >[[${classInfo.description}]]</textarea>
            </div>

            <div class="input-group">
                <label for="classCategory">카테고리</label>
                <select id="classCategory" name="classCategory" required>
                    <option value="개발"
                            th:selected="${classInfo.classCategory} == '개발'">개발</option>
                    <option value="게임개발"
                            th:selected="${classInfo.classCategory} == '게임개발'">게임개발</option>
                    <option value="하드웨어"
                            th:selected="${classInfo.classCategory} == '하드웨어'">하드웨어</option>
                    <option value="보안"
                            th:selected="${classInfo.classCategory} == '보안'">보안</option>
                    <option value="인공지능"
                            th:selected="${classInfo.classCategory} == '인공지능'">인공지능</option>
                </select>
            </div>


            <div class="input-group">
                <label for="classRecom">이런분에게 추천해요!</label>
                <textarea id="classRecom" name="classRecom" >[[${classInfo.classRecom}]]</textarea>
            </div>

            <div class="input-group">
                <label for="classLevel">강의수준</label>
                <select id="classLevel" name="classLevel" required>
                    <option value="초급" th:selected="${classInfo.classLevel} == '초급'">초급</option>
                    <option value="중급" th:selected="${classInfo.classLevel} == '중급'">중급</option>
                    <option value="상급" th:selected="${classInfo.classLevel} == '상급'">상급</option>
                </select>
            </div>


            <div class="input-group">
                <label for="classPrice">강의 가격</label>
                <input type="text" id="classPrice" name="classPrice" th:value="${classInfo.classPrice}" >
            </div>

            <div class="input-group">
                <label>썸네일 이미지</label>
                <div class="image-preview">
                    <img id="thumbnailPreview"
                         th:src="${thumbnail != null ? thumbnail.fileUrl : '/images/default-thumbnail.jpg'}"
                         alt="강의 썸네일" width="200">
                </div>
                <input type="file" id="thumbnailUpload" name="thumbnailFile" accept="image/*" onchange="previewThumbnail(event)">
            </div>

            <input type="submit" value="저장">
        </form>

        <div>
            <form action="/view/classUpdate/second" method="post">
                <input type="hidden" name="classId" th:value="${classInfo.classId}">
                <input type="submit" value="다음">
            </form>
        </div>
    </div>
</div>

<script>
    function previewThumbnail(event) {
        var reader = new FileReader();
        reader.onload = function() {
            var output = document.getElementById('thumbnailPreview');
            output.src = reader.result;
        };
        reader.readAsDataURL(event.target.files[0]);
    }
</script>

</body>
</html>
