<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<header th:fragment="header">
    <div id="header_container">
        <div id="header_left">
            <a href="/">
                <img src="/images/logo3.png">
            </a>
        </div>
        <div id="header_center">
            <input type="text" id="header_search">
            <div id="header_btn"><i class="fa-solid fa-magnifying-glass"></i>검색</div>
        </div>
        <div id="header_right">
            <div class="header_icon">
                <a href="/cart">
                    <i class="fa-solid fa-cart-shopping"></i>
                </a>
            </div>


            <!--관현이형 여기부터-->
            <div class="header_icon"><i class="fa-solid fa-bell" id="header_bell"></i>
                <div id="header_bell_detail">
                    <div id="alarmTotalCount">총 알림 개수 : <span id="totalAlarmCount">0</span>개</div>
                    <div id="alarmList">
                        알림 리스트 나오는곳
                    </div>
                    <div id="alarmFilter">
                        <span id="readAlarmsCount" class="clickable">열람 : <span id="readAlarmCount">0</span>개</span> |
                        <span id="unreadAlarmsCount" class="clickable">미열람 : <span id="unreadAlarmCount">0</span>개</span>
                    </div>
                </div>
            </div>
            <!--관현이형 여기까지-->


            <div class="header_icon"><i class="fa-solid fa-user" id="header_profile_icon"></i>
                <div id="header_profile_detail">
                    <div id="header_profile_detail_section1">
                        <img id="header_profile_img">
                        <div style="display: flex; flex-direction: column;">
                            <a href="/view/mypage/infoForm"><i class="fa fa-home"></i>&nbsp;<span
                                    style="font-weight: bold;vertical-align: top;" id="header_profile_name">Guest</span></a>
                            <a href="/view/class/main" style="color: blueviolet; font-weight: bold;">지식공유방</a>
                        </div>
                    </div>
                    <div id="header_profile_detail_section2">
                        <div><i class="fa fa-shopping-cart"></i><a href="/view/mypage/purchaseHistoryForm">구매내역</a>
                        </div>
                        <div><i class="fa-solid fa-heart"></i><a href="/view/좋아요">좋아요(아직)</a></div>
                        <div><i class="fa-solid fa-gear"></i><a href="/view/설정">설정(아직)</a></div>
                    </div>
                    <div id="header_profile_detail_section3">
                        <div th:if="${user != null}">
                            <a href="/logout">로그아웃</a>
                        </div>
                        <div th:if="${user == null}">
                            <a href="/view/loginForm">로그인</a>
                        </div>

                        <a href="/view/고객센터">고객센터(아직)</a>
                    </div>
                </div>
            </div>
        </div>
</header>
</html>
